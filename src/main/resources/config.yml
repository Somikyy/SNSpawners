#
#   Плагин бесплатный и с открытым исходным кодом. Если он тебе пригодился —
#   загляни в Telegram: там выходят новые плагины линейки SN, а ещё там можно
#   заказать плагин или 3D-модель под свой проект.
#
#                              ▸  t.me/somikyy  ◂
#
# ─────────────────────────────────────────────────────────────────────────────
#  КАК ЭТО РАБОТАЕТ
# ─────────────────────────────────────────────────────────────────────────────
#  Обычный спавнер тикает, спавнит мобов (Entity), мобы тикают и ищут путь,
#  умирают, роняют предметы (ещё Entity), предметы засасывает воронка (ещё тики).
#  На BoxPVP с 500 спавнерами в приватах это гарантированные 8 TPS.
#
#  SNSpawners вырезает всю цепочку: ванильный спавн отключается, а лут
#  рассчитывается математически и складывается в виртуальный склад спавнера.
#  Игрок забирает его из GUI или включает автовыгрузку в привязанный сундук.
#
#  Стоимость обсчёта стака из 10 000 спавнеров равна стоимости обсчёта одного:
#  плагин не бросает кубик 10 000 раз, а сэмплит биномиальное распределение.
# ─────────────────────────────────────────────────────────────────────────────

# Не трогать. Используется для миграции конфигов между версиями.
config-version: 1

general:
  # Язык плагина влияет только на файл сообщений по умолчанию.
  # Все тексты редактируются в messages.yml, все предметы GUI — в gui.yml.

  # Проверять наличие новой версии на GitHub при старте (одна HTTP-запрос, async).
  update-check: true

  # Печатать в консоль отчёт о производительности при /snsp info.
  debug: false


# ─────────────────────────────────────────────────────────────────────────────
#  ПРОИЗВОДИТЕЛЬНОСТЬ
#  Значения по умолчанию рассчитаны на сервер с ~200 онлайна и ~50 000 спавнеров.
# ─────────────────────────────────────────────────────────────────────────────
performance:

  # Как часто (в тиках) запускается обход загруженных спавнеров.
  # 1 = каждый тик. Само производство лута НЕ зависит от этого значения —
  # оно ленивое и точное по системному времени. Обход лишь материализует
  # накопленное: перекладывает в сундук, обновляет голограмму, продаёт.
  sweep-interval: 1

  # Максимум спавнеров, обрабатываемых за один запуск обхода. Курсор
  # кольцевой: остальные достанутся следующему запуску. Это жёсткий потолок
  # нагрузки, а не «примерно» — время прохода не зависит от числа спавнеров.
  #
  # 200 за тик = 4000 спавнеров в секунду. При 50 000 загруженных спавнеров
  # полный круг занимает 12.5 секунды, а стоимость одного тика неизменна.
  max-per-tick: 200

  # Как часто (в тиках) сбрасывать изменённые данные спавнеров в блок (PDC).
  # Запись идёт только для помеченных как «изменённые». 600 тиков = 30 сек.
  save-interval: 600

  # Максимум записей в блок за один проход сохранения.
  max-saves-per-tick: 100

  # Сколько максимум часов производства накапливается, пока чанк выгружен
  # или сервер выключен. Защищает экономику от эксплойта «выключил на месяц».
  # 0 = оффлайн-производство отключено полностью.
  max-offline-hours: 24

  # Порог, после которого плагин переходит с честного перебора на
  # статистический сэмплинг. Ниже порога — обычный цикл (абсолютно точный),
  # выше — биномиальная/пуассоновская аппроксимация (отклонение < 0.5%).
  # Уменьшать смысла нет, увеличивать — только если параноик.
  exact-roll-threshold: 64


# ─────────────────────────────────────────────────────────────────────────────
#  СТАКИНГ
# ─────────────────────────────────────────────────────────────────────────────
stacking:

  # Глобальный потолок стака. Персональный лимит выдаётся правом
  # snspawners.stack.<число> — берётся максимальное из выданных прав,
  # но не выше этого значения.
  max-stack: 2048

  # Радиус (в блоках) поиска подходящего спавнера при установке.
  # 0 = сливать только при установке вплотную к существующему.
  # Больше 8 — не рекомендуется, растёт цена поиска.
  merge-radius: 4

  # Сливать только спавнеры одного владельца.
  merge-same-owner-only: false

  # Шанс (0.0–1.0) получить спавнер обратно при разрушении.
  # Право snspawners.admin всегда даёт 100%.
  break-chance: 1.0

  # Требовать инструмент с «Шёлковым касанием» для разрушения спавнера.
  require-silk-touch: false

  # Разрушать весь стак сразу (shift + ломать) или по одному.
  shift-breaks-whole-stack: true

  # Ванильные спавнеры, найденные в мире (из подземелий), подхватываются
  # плагином при первом взаимодействии и получают стак = 1.
  adopt-natural-spawners: true


# ─────────────────────────────────────────────────────────────────────────────
#  ЗАЩИТА
# ─────────────────────────────────────────────────────────────────────────────
protection:

  # Только владелец (и snspawners.bypass) может ломать спавнер и открывать GUI.
  owner-only: true

  # Спавнеры не разрушаются взрывами (криперы, TNT, кристаллы).
  explosion-proof: true

  # Спавнеры не двигаются поршнями.
  piston-proof: true

  # Запретить установку спавнеров в этих мирах.
  blacklisted-worlds:
    - "spawn_lobby"


# ─────────────────────────────────────────────────────────────────────────────
#  СКЛАД И ВЫГРУЗКА
# ─────────────────────────────────────────────────────────────────────────────
storage:

  # Что делать, когда виртуальный склад заполнен:
  #   STOP    — производство встаёт до освобождения места (по умолчанию)
  #   VOID    — излишки сгорают, производство продолжается
  #   REPLACE — новый лут вытесняет самый дешёвый предмет на складе
  full-behaviour: STOP

  # Автовыгрузка в привязанный контейнер.
  auto-flush:
    enabled: true
    # Как часто перекладывать склад в контейнер, в тиках.
    #
    # Сама выгрузка дорогая: снимок блока, доступ к инвентарю, сборка стопок,
    # проход по всем слотам сундука. Класть туда по три предмета двадцать раз
    # в секунду смысла нет — производство ленивое и ничего не теряет, если
    # забрать накопленное одним движением. 20 тиков = раз в секунду.
    interval: 20
    # Пауза после того, как контейнер оказался забит, в тиках. Пока места нет,
    # каждая попытка — это проход по полному сундуку ради нулевого результата.
    retry-when-full: 100
    # Максимальная дистанция от спавнера до привязываемого контейнера.
    max-link-distance: 8
    # Разрешённые типы контейнеров для привязки.
    allowed-containers:
      - CHEST
      - TRAPPED_CHEST
      - BARREL
      - SHULKER_BOX

  # Автопродажа: лут не кладётся на склад, а сразу конвертируется в деньги.
  # Требует Vault. Включается игроком в GUI, право snspawners.autosell.
  auto-sell:
    enabled: true
    # Комиссия сервера в процентах (0–100). Съедает часть выручки.
    tax-percent: 0.0
    # Не слать сообщение о продаже чаще, чем раз в N секунд (антиспам чата).
    notify-cooldown: 30
    # Пауза между зачислениями выручки в экономику, в секундах. Выручка
    # копится в памяти и уходит в Vault одной операцией на владельца: на поле
    # из сотни автопродающих спавнеров прямые зачисления — это сотни обращений
    # к экономике в секунду, и профиль сервера почти целиком состоит из них
    # (EssentialsX на каждый депозит трогает данные игрока). Перед открытием
    # меню и покупкой улучшения накопленное зачисляется досрочно, при
    # выключении сервера — тоже; при жёстком краше теряется не больше
    # интервала. 0 = зачислять мгновенно, как раньше.
    deposit-interval: 10


# ─────────────────────────────────────────────────────────────────────────────
#  ВНЕШНИЙ ВИД КЛЕТКИ
#  Плагин всегда держит спавнер «неактивным» для клиента: клетка не сыплет
#  частицами огня и дыма и не крутит модель внутри. На поле из сотни
#  спавнеров ванильная анимация — главный пожиратель FPS игроков.
# ─────────────────────────────────────────────────────────────────────────────
visual:
  # Показывать модель моба внутри клетки. Клиент рисует её каждый кадр для
  # каждого спавнера в поле зрения — даже неподвижную, — и сотня клеток с
  # мобами заметно роняет FPS. false — клетка пустая, тип виден на голограмме.
  # Уже стоящие спавнеры подхватывают новое значение при загрузке чанка
  # или сразу после /snsp reload.
  mob-in-spawner: false


# ─────────────────────────────────────────────────────────────────────────────
#  ГОЛОГРАММЫ
#  Используется TextDisplay (клиентская сущность, не тикает, не сохраняется
#  в чанке). Создаётся при загрузке чанка, исчезает при выгрузке. Голограмма
#  всегда полной яркости: читается в темноте и не заставляет клиент сэмплить
#  освещение под каждой строкой.
# ─────────────────────────────────────────────────────────────────────────────
holograms:
  enabled: true

  # Режим показа:
  #   ALWAYS — голограммы видны всем и всегда (в пределах view-range).
  #   LOOK   — игрок видит только голограмму спавнера, на который смотрит
  #            (в пределах look-distance), остальные скрыты.
  # LOOK — режим для серверов с большими полями спавнеров: скрытая сущность
  # клиенту вообще не отправляется, поэтому поле из сотни клеток стоит FPS
  # как одна голограмма. Информация не теряется — навёл прицел и увидел.
  mode: ALWAYS

  # Дальность взгляда для режима LOOK, в блоках.
  look-distance: 8

  # Смещение над центром блока спавнера.
  offset-y: 1.1

  # Дальность видимости в блоках. Меньше = меньше пакетов клиенту.
  view-range: 24

  # Обновлять текст голограммы не чаще, чем раз в N тиков.
  update-interval: 40

  # Строки. Плейсхолдеры: %type%, %stack%, %level%, %storage%, %storage_max%,
  # %storage_percent%, %owner%, %rate%
  #
  # %type% УЖЕ несёт свой цвет из spawners.yml — оборачивать его в ещё один
  # градиент не нужно. Плагин такую вложенность переживёт (внутренний цвет
  # победит), но смысла в ней нет. Хочешь другой цвет типа — правь его
  # display в spawners.yml.
  lines:
    - "%type% <#8A8A8A>× <#FFD75E>%stack%"
    - "<#5A5A5A>Склад: <#B8B8B8>%storage%<#5A5A5A>/<#B8B8B8>%storage_max%"


# ─────────────────────────────────────────────────────────────────────────────
#  ЗВУКИ
#  Формат: ЗВУК:громкость:высота. Пустая строка = без звука.
# ─────────────────────────────────────────────────────────────────────────────
sounds:
  menu-open: "BLOCK_BARREL_OPEN:0.6:1.4"
  menu-click: "UI_BUTTON_CLICK:0.4:1.6"
  collect: "ENTITY_ITEM_PICKUP:0.7:1.2"
  sell: "BLOCK_NOTE_BLOCK_PLING:0.8:1.8"
  upgrade: "ENTITY_PLAYER_LEVELUP:0.7:1.4"
  stack-merge: "BLOCK_ANVIL_USE:0.5:1.9"
  error: "ENTITY_VILLAGER_NO:0.6:1.0"


# ─────────────────────────────────────────────────────────────────────────────
#  ЭКОНОМИКА
# ─────────────────────────────────────────────────────────────────────────────
economy:
  # Если Vault не найден, кнопки продажи и апгрейда скрываются автоматически.
  # Формат вывода денег. #,##0.## — 1 234 567.89
  money-format: "#,##0.##"

  # Компактный формат больших чисел в GUI (1.2K, 3.4M, 5.6B, 7.8T).
  compact-numbers: true
