    current:
      name: "<#FFD75E>&lУровень %lvl% <#3A3A3A>· текущий"
      glow: true
      lore:
        - ""
        - " <#5A5A5A>Скорость <#3A3A3A>· <#FFD75E>×%speed%"
        - " <#5A5A5A>Удача <#3A3A3A>· <#FFD75E>+%fortune%%"
        - " <#5A5A5A>Склад <#3A3A3A>· <#FFD75E>%storage%"
        - ""
        - " <#FFD75E>◆ Активен сейчас"

    available:
      name: "<#00E1FF>&lУровень %lvl%"
      lore:
        - ""
        - " <#5A5A5A>Скорость <#3A3A3A>· <#B8B8B8>×%speed%"
        - " <#5A5A5A>Удача <#3A3A3A>· <#B8B8B8>+%fortune%%"
        - " <#5A5A5A>Склад <#3A3A3A>· <#B8B8B8>%storage%"
        - ""
        - " <#5A5A5A>Цена <#3A3A3A>· <#FFD75E>%cost%"
        - " <#5A5A5A>Баланс <#3A3A3A>· <#B8B8B8>%balance%"
        - ""
        - " <#7B2FFF>▸ <#B8B8B8>ЛКМ <#5A5A5A>— купить"

    locked:
      material: BARRIER
      name: "<#5A5A5A>&lУровень %lvl% <#3A3A3A>· закрыт"
      lore:
        - ""
        - " <#5A5A5A>Скорость <#3A3A3A>· <#3A3A3A>×%speed%"
        - " <#5A5A5A>Удача <#3A3A3A>· <#3A3A3A>+%fortune%%"
        - " <#5A5A5A>Склад <#3A3A3A>· <#3A3A3A>%storage%"
        - ""
        - " <#FF5C5C>✘ Сначала купи предыдущий уровень"

  items:
    back:
      enabled: true
      slot: 40
      material: ARROW
      name: "<#B8B8B8>← К спавнеру"
      lore: [ ]
