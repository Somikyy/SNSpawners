# ─────────────────────────────────────────────────────────────────────────────
#  SNSpawners · Типы спавнеров, таблицы лута и уровни улучшений
#  Автор: Somikyy · t.me/somikyy · разработка плагинов и 3D-моделей
# ─────────────────────────────────────────────────────────────────────────────
#
#  ТИП СПАВНЕРА
#    display     — имя в GUI, голограмме и сообщениях (HEX/градиенты работают)
#    icon        — материал иконки в GUI
#    period      — секунд между циклами производства для ОДНОГО спавнера
#    per-cycle   — сколько мобов «спавнится» за цикл на один спавнер
#    xp          — [min, max] опыта с одного моба
#    price       — цена одного спавнера этого типа (для /snsp give и магазинов)
#    enabled     — false полностью отключает тип
#
#  ЗАПИСЬ ЛУТА (loot.<любой_id>)
#    item        — материал предмета
#    amount      — [min, max] штук при выпадении
#    chance      — вероятность выпадения с одного моба (0.0–1.0)
#    price       — цена за 1 штуку при продаже (нужен Vault)
#    name        — (опц.) кастомное имя предмета
#    lore        — (опц.) кастомное описание
#    model-data  — (опц.) CustomModelData для ресурспака
#    enchants    — (опц.) список 'ЗАЧАРОВАНИЕ:уровень'
#    affected-by-fortune — (опц., по умолчанию true) растёт ли от улучшения
#
#  Формула производства за проход:
#    мобов = циклы × стак × per-cycle
#    штук  = Σ( биномиальное(мобов, chance) × равномерное(amount) ) × (1 + fortune)
#  Стоимость расчёта не зависит от размера стака.
# ─────────────────────────────────────────────────────────────────────────────

# Уровни улучшения общие для всех типов.
#   cost     — цена перехода НА этот уровень (Vault)
#   speed    — множитель скорости (2.0 = вдвое быстрее)
#   storage  — вместимость виртуального склада в штуках предметов
#   fortune  — прибавка к количеству лута (0.25 = +25%)
#   material — иконка уровня в меню улучшений
